<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏪 Shop MVP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>🏪 Shop MVP</h1>
      <p>A simple system for improving walk-in store efficiency</p>
    </header>

    <main class="grid">
      <!-- Left column -->
      <section class="left">
        <!-- 🔍 Search + Filter + Clear Cart controls -->
        <div class="controls">
          <div class="search">
            <input id="searchInput" type="search" placeholder="Search products (name or category)..." aria-label="Search products" />
          </div>

          <div class="left-controls">
            <label for="categoryFilter">Category:</label>
            <select id="categoryFilter" aria-label="Filter by category">
              <option value="all">All</option>
            </select>
            <button id="clearCartBtn" class="btn btn-ghost" aria-label="Clear cart">Clear Cart</button>
          </div>
        </div>

        <h2>Available Products</h2>
        <div id="items" class="items-grid" aria-live="polite"></div>
      </section>

      <!-- Right column -->
      <aside class="right">
        <div class="card cart">
          <h2>Your Cart 🛒</h2>
          <div id="cart" aria-live="polite">
            <!-- Cart items will be inserted here -->
            <p style="color:#6b7280">Your cart is empty — add items to get started.</p>
          </div>
          <p><strong>Total:</strong> ₱<span id="total">0.00</span></p>
        </div>

        <div class="card recs">
          <h2>Recommended for You 💡</h2>
          <div id="recommendations" aria-live="polite">
            <p style="color:#6b7280">Add something to your cart to get recommendations.</p>
          </div>
        </div>
      </aside>
    </main>

    <footer>
      <p>Made for <strong>Introduction to Modeling and Simulation (IMODSIM)</strong></p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
