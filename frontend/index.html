<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shop MVP</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background: #fafafa;
      }
      h1 {
        color: #333;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 10px;
        margin-bottom: 20px;
      }
      .card {
        background: #fff;
        border-radius: 8px;
        padding: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      .card h3 {
        margin: 5px 0;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
      }
      button:hover {
        background: #0056b3;
      }
      .cart, .recommendations {
        background: white;
        padding: 10px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        margin-bottom: 20px;
      }
      .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h1>🏪 Shop MVP</h1>

    <div>
      <label>Filter by category:</label>
      <select id="categoryFilter"></select>
    </div>

    <h2>Items</h2>
    <div id="items" class="grid"></div>

    <h2>🛒 Cart</h2>
    <div id="cart" class="cart"></div>
    <p><strong>Total: $<span id="total">0.00</span></strong></p>

    <h2>⭐ Recommendations</h2>
    <div id="recommendations" class="recommendations"></div>

    <script src="app.js"></script>
  </body>
</html>
